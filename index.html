const EXC3 = [
["c01","Adjectifs de couleur simples : ils s'accordent","Les vrais adjectifs de couleur (blanc, noir, bleu, vert, jaune, gris, violet, brun, blond, châtain) s'accordent en genre et en nombre : des écharpes violettes, des cheveux châtains.",["Elle a acheté deux écharpes [violet|violettes].","Ses cheveux [châtain|châtains] étaient coupés court.","Des chemises [blanc|blanches] étaient pliées sur le lit.","Des fleurs [jaune|jaunes] bordaient l'allée."]],
["c02","Nom employé comme couleur : invariable","Quand la couleur est un nom de fruit, de fleur, de pierre ou d'objet (marron, orange, crème, kaki, turquoise, émeraude, lilas, noisette, ocre, bordeaux, saumon, cerise, olive, sable), elle reste invariable : des mocassins marron.",["Il portait des mocassins [marrons|marron].","Des rideaux [oranges|orange] égayaient la pièce.","Elle a les yeux [noisettes|noisette].","Les façades [ocres|ocre] du village sont typiques.","Il a choisi des coussins [turquoises|turquoise]."]],
["c03","Rose, mauve, pourpre, fauve, écarlate : ils s'accordent","Exception à la règle précédente : rose, mauve, pourpre, fauve, écarlate et incarnat sont devenus de vrais adjectifs et s'accordent : des pivoines roses, des gants mauves.",["Le bouquet mêlait des pivoines [rose|roses] et blanches.","Des tentures [pourpre|pourpres] décoraient la salle.","Les joues [écarlate|écarlates] de l'orateur trahissaient sa gêne.","Elle portait des gants [mauve|mauves]."]],
["c04","Couleur nuancée qui qualifie un nom : invariable","Quand une couleur nuancée est employée comme adjectif, c'est-à-dire qu'elle qualifie un nom (des vestes bleu marine), et que l'adjectif de couleur est précisé par un autre mot (foncé, clair, vif, pâle, ciel, marine, bouteille, mat), l'ensemble reste invariable : des chemises bleu ciel, des yeux vert foncé.",["Des chemises [bleues ciel|bleu ciel] étaient en vitrine.","Elle a les yeux [verts foncé|vert foncé].","Des robes [rouges vif|rouge vif] défilaient sur le podium.","Il porte des vestes [bleues marine|bleu marine].","Des pulls [verts bouteille|vert bouteille] étaient soldés."]],
["c08","Couleur nuancée employée comme nom","Quand le composé de couleur est lui-même un nom (on peut mettre un déterminant devant : des bleus ciel), trois cas : deux noms de couleur restent invariables avec un trait d'union (des bleu-vert ravissants) ; nom de couleur + nom qui n'est pas une couleur, seul le premier varie (des bleus ciel, des verts pomme) ; nom de couleur + adjectif, les deux varient (ces bleus foncés).",["Le peintre mélange des [bleu ciel|bleus ciel] lumineux.","Ces [bleu foncé|bleus foncés] rappellent la mer en hiver.","La collection décline des [bleus-verts|bleu-vert] ravissants.","Elle hésite entre plusieurs [vert pomme|verts pomme] pour sa façade."]],
["c05","Deux couleurs combinées (bleu-vert) : invariable","Deux adjectifs de couleur réunis pour former une seule nuance restent invariables et prennent un trait d'union : des yeux vert-gris, une mer bleu-vert.",["Il a les yeux [verts-gris|vert-gris].","Les vagues prenaient des reflets [bleus-violets|bleu-violet].","Une eau [bleue-verte|bleu-vert] baignait la crique."]],
["c06","Couleurs coordonnées : un objet bicolore ou plusieurs couleurs","Si chaque objet porte les deux couleurs, elles restent invariables (des drapeaux bleu et blanc). Si certains objets sont d'une couleur et d'autres d'une autre, chaque adjectif s'accorde (des roses blanches et rouges).",["Chaque maillot était à la fois rouge et noir : des maillots [rouges et noirs|rouge et noir].","Certaines roses étaient blanches, d'autres rouges : un bouquet de roses [blanc et rouge|blanches et rouges].","Les drapeaux, tous bicolores, étaient [bleus et blancs|bleu et blanc]."]],
["c07","Orangé, rosé, verdâtre, bleuté : ils s'accordent","Les adjectifs dérivés d'une couleur (orangé, rosé, violacé, bleuté, verdâtre, jaunâtre) sont de vrais adjectifs et s'accordent, même quand le nom de départ est invariable : orange, mais des reflets orangés.",["Le ciel prenait des teintes [orangé|orangées] au coucher du soleil.","Des eaux [verdâtre|verdâtres] stagnaient dans le bassin.","Ses lèvres [violacé|violacées] inquiétaient le médecin.","Les vitres renvoyaient des reflets [bleuté|bleutés]."]],
["n01","Noms composés : nom + nom","Quand deux noms de même rang sont réunis (l'un est une sorte de l'autre), les deux prennent la marque du pluriel : des choux-fleurs, des oiseaux-mouches, des wagons-lits.",["Le marché proposait des [chou-fleurs|choux-fleurs] à bas prix.","Plusieurs [oiseau-mouches|oiseaux-mouches] butinaient les fleurs.","Les [wagon-lits|wagons-lits] ont disparu des trains de nuit.","Ils ont ouvert deux [café-restaurants|cafés-restaurants] en ville."]],
["n02","Noms composés : nom + complément","Quand le second nom complète le premier (souvent avec de ou à, même sous-entendu), seul le premier varie : des pommes de terre, des timbres-poste (pour la poste), des eaux-de-vie.",["Il collectionne les [timbre-postes|timbres-poste].","Elle a épluché trois [pomme de terres|pommes de terre].","Ces [eau-de-vies|eaux-de-vie] vieillissent en fût de chêne.","Il a fait plusieurs [croc-en-jambes|crocs-en-jambe] à ses adversaires."]],
["n03","Noms composés : nom + adjectif","Quand un nom est associé à un adjectif, les deux varient : des coffres-forts, des cerfs-volants, des rouges-gorges, des plates-bandes.",["Les banques possèdent des [coffre-forts|coffres-forts] blindés.","Les enfants faisaient voler des [cerf-volants|cerfs-volants].","Des [rouge-gorges|rouges-gorges] picoraient dans le jardin.","Il désherbe ses [plate-bandes|plates-bandes] chaque printemps."]],
["n04","Noms composés : verbe + nom","Le verbe ne prend jamais la marque du pluriel : des tire-bouchons, des ouvre-boîtes, des porte-avions, des sèche-cheveux.",["Le tiroir contient deux [tires-bouchons|tire-bouchons].","La marine dispose de plusieurs [portes-avions|porte-avions].","Elle a acheté des [ouvres-boîtes|ouvre-boîtes].","Les [sèches-cheveux|sèche-cheveux] de l'hôtel sont en panne."]],
["n05","Garde- : personne ou objet ?","Quand garde désigne une personne, c'est un nom et il varie : des gardes-malades. Quand il désigne un objet, c'est le verbe garder et il reste invariable : des garde-fous, des garde-boue.",["Deux [garde-malades|gardes-malades] veillaient le patient.","Les [gardes-fous|garde-fous] du pont ont été renforcés.","Les [gardes-boue|garde-boue] du vélo sont tordus."]],
["n06","Noms composés : mot invariable + nom","Avec un adverbe ou une préposition (arrière, avant, contre, sous, haut au sens d'en haut, non), seul le nom varie : des arrière-pensées, des haut-parleurs, des contre-attaques.",["Il a sûrement des [arrières-pensées|arrière-pensées].","Les [hauts-parleurs|haut-parleurs] de la salle grésillaient.","Les [contres-attaques|contre-attaques] se sont multipliées.","Les [avants-gardes|avant-gardes] artistiques ont bousculé les codes."]],
["n07","Grand-père, nouveau-né, nouveau venu","grand prend un s dans grands-pères et grands-parents. nouveau reste invariable devant un participe dans nouveau-né (des nouveau-nés), mais s'accorde dans nouveaux venus, nouveaux mariés.",["Ses deux [grand-pères|grands-pères] étaient médecins.","La maternité accueille chaque jour des [nouveaux-nés|nouveau-nés].","Les [nouveau venus|nouveaux venus] ont été accueillis par la direction.","Les [nouveau mariés|nouveaux mariés] partent en voyage."]],
["n08","Noms composés invariables","Certains noms composés ne varient pas : des hors-d'œuvre, des tête-à-tête, des face-à-face, des pot-au-feu, des on-dit.",["Le traiteur a servi des [hors-d'œuvres|hors-d'œuvre] variés.","Ils ont eu plusieurs [tête-à-têtes|tête-à-tête] avant de signer.","Les [face-à-faces|face-à-face] télévisés attirent les foules.","Ne vous fiez pas aux [on-dits|on-dit]."]],
["n09","Adjectifs composés : sourd-muet, aigre-doux, mort-né","Deux adjectifs réunis varient tous les deux (des enfants sourds-muets, des sauces aigres-douces). Dans mort-né, mort reste invariable : des projets mort-nés.",["Cette école accueille des enfants [sourd-muets|sourds-muets].","Le chef prépare des sauces [aigre-douces|aigres-douces].","Ces projets [morts-nés|mort-nés] ont coûté cher.","Les fêtards sont rentrés [ivre morts|ivres morts]."]],
["a01","Adjectif employé comme adverbe : invariable","Après un verbe, certains adjectifs jouent le rôle d'adverbes et restent invariables : coûter cher, sentir bon, chanter juste, voir clair, tenir bon, parler haut, travailler dur.",["Ces chaussures coûtent [chères|cher].","Ces fleurs sentent [bonnes|bon].","Elles ont chanté [justes|juste] toute la soirée.","Les négociateurs ont tenu [bons|bon] jusqu'au bout.","Ces étudiantes travaillent [dures|dur] pour réussir."]],
["a02","Fort, haut, bas devant un adjectif : invariables","Devant un adjectif ou un participe, fort (= très) et haut (= à un rang élevé) sont des adverbes invariables : elles sont fort satisfaites, des personnes haut placées.",["Elles étaient [fortes|fort] satisfaites du résultat.","Des responsables [hauts placés|haut placés] ont démenti l'information.","Les recrues, [fortes|fort] motivées, ont tout donné.","Ces fonctionnaires [hautes placées|haut placées] connaissent le dossier."]],
["a03","Frais cueilli, grand ouvert : ils s'accordent","Par exception, frais, grand, large et premier s'accordent devant un participe : des roses fraîches cueillies, les yeux grands ouverts, des fenêtres larges ouvertes.",["Des roses [frais|fraîches] cueillies ornaient la table.","Il garde les yeux [grand|grands] ouverts toute la nuit.","Les portes étaient [large|larges] ouvertes.","Les [premier|premiers] arrivés ont eu les meilleures places."]],
["g01","Genre trompeur : série A","À connaître par cœur. Masculins : un agrume, un amalgame, l'amiante (m.), un antipode, un armistice, un astérisque, l'asphalte (m.). Féminins : une acné, une alcôve, une anagramme, une apostrophe, une azalée.",["Il a pris [une|un] agrume dans la corbeille.","Il a fait [une|un] amalgame regrettable.","L'amiante est [dangereuse|dangereux] pour la santé.","Sa position est l'antipode [exacte|exact] de la mienne.","Il souffre d'[un acné sévère|une acné sévère].","Ils dormaient dans [un|une] alcôve sombre.","Elle a trouvé [un|une] anagramme de son prénom.","[Un|Une] apostrophe s'est glissée dans le titre.","[Une|Un] armistice fut signé en 1918.","Ajoutez [une|un] astérisque en bas de page.","L'asphalte [brûlante|brûlant] collait aux semelles.","Elle a planté [un|une] azalée devant la maison."]],
["g02","Genre trompeur : série B","Masculins : un effluve, un éloge, un équinoxe, un hémisphère, un interclasse, un intervalle, un ivoire. Féminins : une échappatoire, une épitaphe, une épithète, une icône, une idylle, une interview.",["[Une|Un] effluve de jasmin envahit la pièce.","Le directeur lui a adressé [une éloge appuyée|un éloge appuyé].","L'équinoxe [printanière|printanier] tombe le 20 mars.","Elle cherchait [un|une] échappatoire.","Il a fait graver [un|une] épitaphe sur la stèle.","L'épithète [placé|placée] avant le nom change de sens.","L'hémisphère [australe|austral] connaît l'été en décembre.","L'icône de l'application est trop [petit|petite].","[Une|Un] interclasse de dix minutes permet de souffler.","[Une|Un] intervalle de dix minutes sépare les deux trains.","Ils vivent [un|une] idylle passionnée.","Elle a accordé [un|une] interview exclusive au journal.","[Une|Un] ivoire ancien est exposé au musée."]],
["g03","Genre trompeur : série C","Masculins : un méandre, un obélisque, un opuscule, un pétale, un tentacule, un apogée. Féminins : une orbite, une octave, une omoplate, une atmosphère, une volte-face, des arrhes.",["Le fleuve dessine [une|un] méandre paresseux.","[Une|Un] obélisque se dresse place de la Concorde.","Il a publié [une|un] opuscule sur la fiscalité.","Le satellite a été placé sur [un|une] orbite basse.","Il chante [un|une] octave plus haut.","Il s'est fracturé [un|une] omoplate.","Il régnait [un|une] atmosphère pesante.","[La|Le] pétale s'est détaché de la fleur.","[Une|Un] tentacule s'enroula autour du mât.","Les arrhes versées sont [perdus|perdues] en cas d'annulation.","Il a fait [un|une] volte-face surprenante.","Cette carrière a connu [une|un] apogée tardif."]],
["g04","Terminaisons trompeuses I","Les noms en -ée, -ie, -ette, -eurre sont souvent féminins, mais le musée, le trophée, le lycée, le génie, l'incendie, le parapluie, le squelette, le leurre, le beurre sont masculins. À l'inverse, la clé, la fourmi, la tribu, la vertu sont féminins.",["Ce musée est [fermée|fermé] le lundi.","Le trophée [remportée|remporté] trône dans le hall.","Ce génie [méconnue|méconnu] a révolutionné la physique.","[Une|Un] incendie a ravagé l'entrepôt.","Il a oublié [sa|son] parapluie au bureau.","[Une|Un] squelette complet a été retrouvé.","Cette offre n'est qu'[une|un] leurre.","[Un|Une] clé est restée sur la porte.","[Un|Une] fourmi transportait une miette.","La tribu s'est [installé|installée] près du fleuve.","La vertu est rarement [récompensé|récompensée].","Le beurre [salée|salé] est une spécialité bretonne."]],
["g05","Terminaisons trompeuses II","Les noms en -oire sont souvent féminins, mais le pourboire, le territoire, le laboratoire, le déboire, l'interrogatoire, le conservatoire sont masculins. Les noms en -eur sont souvent masculins, mais la peur, la rumeur, la douleur sont féminins (le labeur reste masculin). Féminins aussi : la brebis, la glu, la bru. Masculins : le mausolée, le scarabée, le sosie.",["Il a laissé [une|un] pourboire généreux.","Ce territoire [conquise|conquis] fut rendu.","[La|Le] laboratoire ferme à 18 heures.","Il a connu de [cruelles|cruels] déboires.","L'interrogatoire a été [longue|long].","Elle est entrée au conservatoire [régionale|régional].","[Un|Une] brebis s'est égarée.","Cette glu est très [collant|collante].","Sa bru est [charmant|charmante].","Il a eu [un|une] peur bleue.","Une rumeur [persistant|persistante] circule.","[Une|Un] labeur acharné lui a permis de réussir.","Le mausolée, [construite|construit] au XIXe siècle, est classé.","Elle a croisé [une|un] sosie de son père.","[Une|Un] scarabée doré grimpait sur la feuille."]],
["g06","Noms en -té et -tié : pas de e final","Les noms féminins en -té et -tié ne prennent pas de e final (la beauté, la moitié, l'amitié), sauf la dictée, la jetée, la montée, la nuitée, la pâtée, la portée, la potée, la butée, la tétée, la platée et l'assiettée.",["La [beautée|beauté] du paysage l'émerveilla.","Il a fait trois fautes à la [dicté|dictée].","Elle a pris la [moitiée|moitié] du gâteau.","Une profonde [amitiée|amitié] les unit.","Les enfants jouaient sur la [jeté|jetée].","La [libertée|liberté] d'expression est un droit.","La [nuité|nuitée] coûte 90 euros.","Le chien a mangé sa [pâté|pâtée].","Cette [qualitée|qualité] est rare.","La [monté|montée] des eaux inquiète les habitants.","Ce bruit est hors de [porté|portée]."]],
["g07","Amour, délice, orgue : féminins au pluriel","Ces trois noms sont masculins au singulier mais féminins au pluriel : un délice, des délices infinies ; un orgue ancien, les grandes orgues ; ses premières amours.",["Les [grands|grandes] orgues de la cathédrale ont retenti.","Ce dessert est [une|un] vrai délice.","Il évoquait ses premières amours, [oubliés|oubliées] depuis longtemps.","Cet orgue est très [ancienne|ancien]."]],
["g08","Noms qui changent de sens avec le genre","un livre (ouvrage) / une livre (500 g) ; un mémoire (écrit) / la mémoire ; un poêle (chauffage) / une poêle (cuisine) ; un somme (sieste) / une somme ; un poste (emploi) / la poste ; le voile / la voile (bateau).",["Il a acheté [un|une] livre de cerises.","Elle a soutenu [une|un] mémoire de master.","Faites revenir les oignons dans [un|une] poêle.","Il a fait [une petite|un petit] somme après le déjeuner.","Elle a obtenu [une|un] poste de directrice financière."]],
["pp01","Avec être : accord avec le sujet","Avec l'auxiliaire être, le participe passé s'accorde avec le sujet, en genre et en nombre : elles sont parties.",["Elles sont [parti|parties] tôt ce matin.","La lettre est [arrivé|arrivée] en retard.","Les candidates sont [venu|venues] en avance.","Les filles sont [allé|allées] au cinéma."]],
["pp02","Voix passive : le sujet subit l'action","À la voix passive (être + participe), le sujet ne fait pas l'action, il la subit ; le participe s'accorde avec lui : la directrice a été élue.",["La directrice a été [élu|élue] à l'unanimité.","Les comptes ont été [validé|validés] par l'auditeur.","Ces mesures seront [appliqué|appliquées] dès janvier.","La décision a été [pris|prise] hier soir."]],
["pp03","Avec avoir : jamais d'accord avec le sujet","Avec avoir, le participe ne s'accorde jamais avec le sujet. Il ne s'accorde qu'avec un COD placé avant.",["Elles ont [mangées|mangé] ensemble.","Les stagiaires ont [terminés|terminé] leur rapport.","Les associées ont [signées|signé] le bail.","La directrice a [validée|validé] les comptes."]],
["pp04","Sortir, monter, passer : être ou avoir selon le sens","Sans COD, ces verbes prennent être et s'accordent avec le sujet (elle est sortie). Avec un COD, ils prennent avoir et ne s'accordent qu'avec un COD placé avant (elle a sorti la poubelle ; les cartons qu'il a montés).",["Elle a [sortie|sorti] la poubelle ce matin.","Elle est [sorti|sortie] sans son manteau.","Ils ont [montés|monté] les cartons au grenier.","Les cartons qu'ils ont [monté|montés] sont lourds.","Les vacances sont [passé|passées] trop vite."]],
["pp05","COD placé avant : l', les, que, combien","Avec avoir, le participe s'accorde avec le COD s'il est placé avant : ta lettre, je l'ai lue ; quelles décisions a-t-il prises ?",["Ta lettre, je l'ai [lu|lue] hier soir.","Combien de pages as-tu [lu|lues] ?","Quelles décisions a-t-il [pris|prises] ?","Ces dossiers, je les ai [classé|classés] par date.","Sa carte bancaire, il l'a [égaré|égarée] à la gare."]],
["pp06","Pas de COD placé avant : invariable","Pas d'accord si ce qui précède n'est pas un COD : complément indirect (à qui, lui, leur), durée, ou COD placé après le verbe.",["Les clientes à qui j'ai [parlées|parlé] étaient ravies.","Elle nous a [téléphonés|téléphoné] hier.","Les trois heures qu'il a [dormies|dormi] ne lui ont pas suffi.","Nous leur avons [envoyés|envoyé] le contrat."]],
["pp07","Participe + infinitif : qui fait l'action ?","Le participe suivi d'un infinitif s'accorde si le COD placé avant fait l'action de l'infinitif. Les fruits que j'ai vus tomber (les fruits tombent) ; la chanson que j'ai entendu chanter (ce n'est pas la chanson qui chante).",["Les fruits que j'ai [vu|vus] tomber sont pourris.","La chanson que j'ai [entendue|entendu] chanter est récente.","La chanteuse que j'ai [entendu|entendue] chanter est remarquable.","Cette imprimante, je ne l'ai jamais [vu|vue] fonctionner.","Cette décision, je l'ai [vue|vu] prendre par le patron."]],
["pp08","Pronominaux réfléchis : se est-il COD ?","Si se est COD (elle a estimé qui ? elle-même), on accorde : elle s'est estimée capable. Si le COD est placé après, pas d'accord : elle s'est léché les babines.",["Elle s'est [estimé|estimée] capable de réussir seule.","La chatte s'est [léché|léchée] avec application.","Elle s'est [léchée|léché] les babines avec gourmandise.","Vous êtes-vous [passés|passé] de la crème avant de sortir ?"]],
["pp09","Pronominaux : COD placé avant ou après","Ils se sont acheté une maison (COD après : pas d'accord). La maison qu'ils se sont achetée (COD que placé avant : accord).",["Ils se sont [achetés|acheté] une maison.","La maison qu'ils se sont [acheté|achetée] est en travaux.","La robe qu'elle s'est [fait|faite] est superbe.","Les policiers se sont [passés|passé] des informations.","Les excuses qu'il s'est [inventé|inventées] ne tiennent pas."]],
["pp10","Pronominaux de sens passif ou essentiels","Quand le sujet subit l'action (cette histoire s'est passée au XIXe siècle) ou que le verbe est toujours pronominal (s'absenter, s'envoler), on accorde avec le sujet.",["Cette histoire s'est [passé|passée] au XIXe siècle.","Mes voisins se sont [absenté|absentés] très souvent.","La porte s'est [refermé|refermée] à grand fracas.","Les oiseaux se sont [envolé|envolés] d'un coup."]],
["pp11","Se succéder, se parler, se passer le mot","Quand se est complément indirect (on succède à, on parle à, on passe le mot à quelqu'un), le participe reste invariable : des informations contradictoires se sont succédé.",["Des informations contradictoires se sont [succédées|succédé].","Elles se sont [passées|passé] le mot.","Ils se sont [parlés|parlé] pendant des heures.","Les deux sœurs se sont [souries|souri] en silence."]],
["pp12","Attendu, passé, étant donné, mis à part","Placés devant le nom, ces participes jouent le rôle de prépositions et restent invariables : attendu les services rendus, passé cette date.",["[Attendus|Attendu] les services qu'il nous a rendus, nous le garderons.","[Passée|Passé] cette date, l'offre ne sera plus valable.","[Étant donnés|Étant donné] les délais, il faut se hâter.","[Mises|Mis] à part deux erreurs, la copie est parfaite."]],
["pp13","Échouer, démissionner, augmenter : avoir","Ces verbes se conjuguent avec avoir : j'ai échoué, il a démissionné, les prix ont augmenté.",["L'année dernière, je [suis|ai] échoué à l'épreuve de saut.","Il [est|a] démissionné la semaine dernière.","Les loyers [sont|ont] augmenté de 5 %.","Elle [est|a] divorcé il y a deux ans."]]

const PRX=/\[([^|\]]*)\|([^|\]]*)(?:\|([^\]]*))?\]/g;

  for(let i=0;i<ch.length;i++){if(ch[i]===" "&&(/[:;!?»]/.test(ch[i+1]||"")||ch[i-1]==="«"))ch[i]="\u00a0";}

  return {toks,errs};}

function pickRule(x,y){if(!x)return y;if(!y)return x;const nx=x.n||0,ny=y.n||0;const w=ny>nx||(ny===nx&&(y.d||0)>(x.d||0))?y:x,o=w===x?y:x;const r=Object.assign({},w);if(!r.it&&o.it)r.it=o.it;if(r.li==null&&o.li!=null)r.li=o.li;return r;}
function mergeMod(a,b){if(!b)return a;if(!a)return b;const r=Object.assign({},a.r);Object.keys(b.r||{}).forEach(id=>{r[id]=pickRule(a.r[id],b.r[id]);});
  const t=today(),rd=[a.rd,b.rd].filter(x=>x&&x.d===t).sort((x,y)=>(y.n||0)-(x.n||0))[0]||a.rd||null;
  return {r,sec:Math.max(a.sec||0,b.sec||0),q:Math.max(a.q||0,b.q||0),c:Math.max(a.c||0,b.c||0),u:Math.max(a.u||0,b.u||0),last:(b.u||0)>(a.u||0)?b.last:a.last,ul:a.ul||b.ul,adv:a.adv,rd};}
async function pullMerge(m){const snap=await DB.doc("data/users/"+UID+"/"+m).get();let remote=null;

  if(!remote)return false;const before=JSON.stringify(S[m].r);S[m]=mergeMod(S[m],remote);saveLocal(m);return JSON.stringify(S[m].r)!==before;}

const RX=/\[([^|\]]*)\|([^\]]*)\]/g;
function parse(s){const parts=[];let last=0,m;RX.lastIndex=0;while((m=RX.exec(s))){if(m.index>last)parts.push({p:s.slice(last,m.index)});parts.push({w:m[1],r:m[2],err:true});last=m.index+m[0].length;}if(last<s.length)parts.push({p:s.slice(last)});return parts;}
function tokens(parts,ver){
  const ch=[],fl=[];
  parts.forEach(pt=>{const t=pt.err?(ver==="w"?pt.w:pt.r):pt.p;for(const c of t){ch.push(c);fl.push(!!pt.err);}});
  for(let i=0;i<ch.length;i++){if(ch[i]===" "&&(/[:;!?»]/.test(ch[i+1]||"")||ch[i-1]==="«"))ch[i]=" ";}
  const out=[];let cur="",err=false;
  for(let i=0;i<ch.length;i++){if(ch[i]===" "){if(cur)out.push({t:cur,err});cur="";err=false;}else{cur+=ch[i];if(fl[i])err=true;}}
  if(cur)out.push({t:cur,err});
  return out;
}
const hasErr=s=>{RX.lastIndex=0;return RX.test(s);};
const errText=(parts,ver)=>tokens(parts,ver).filter(t=>t.err).map(t=>t.t.replace(/[ .,;:!?»]+$/,"")).join(" ");

/* Ancrage mémoriel : une notion ratée revient 2 à 3 questions plus tard, puis à J+2, J+5, J+12, J+25, J+50, J+90.

const IV=[2,5,12,25,50,90],DAY=864e5;
const jit=d=>Math.round(d*DAY*(0.85+Math.random()*0.3));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();};
function getDQ(){try{return +localStorage.getItem("graphie.dq")||15;}catch(e){return 15;}}

const doneToday=m=>{const r=S[m].rd;return r&&r.d===today()?r.n:0;};
const bonusToday=()=>{const r=S.exp.rd;return r&&r.d===today()?(r.b||0):0;};
function todayAlloc(){const pend={},al={};let left=Math.max(0,DQV+bonusToday()-ORDER.reduce((a,m)=>a+doneToday(m),0));
  ORDER.forEach(m=>{pend[m]=memRules(m).length;al[m]=0;});
  while(left>0&&ORDER.some(m=>al[m]<pend[m])){ORDER.forEach(m=>{if(left>0&&al[m]<pend[m]){al[m]++;left--;}});}
  return al;}
const todayN=m=>todayAlloc()[m];
const isDue=(m,id)=>{const s=S[m].r[id];return !!(s&&s.m&&s.d&&s.d<=Date.now());};
const toRework=(m,id)=>{const s=S[m].r[id];return !!(s&&!s.m&&s.e>0);};
function memRules(m){return Object.values(RULES[m]).filter(r=>toRework(m,r.id)||isDue(m,r.id)).sort((a,b)=>(toRework(m,b.id)-toRework(m,a.id))||((S[m].r[a.id].d||0)-(S[m].r[b.id].d||0)));}
function nextDue(m){let t=0;Object.values(S[m].r).forEach(s=>{if(s.m&&s.d&&s.d>Date.now()&&(!t||s.d<t))t=s.d;});return t;}
function newSes(o){return Object.assign({last:null,n:0,ok:0,rev:{},again:[],goal:2},o);}
function startLevel(m,ti,li){S[m].last={ti,li};const pool=MODS[m].tracks[ti].levels[li].rules;
  if(pool.every(r=>isM(m,r.id)))ses=newSes({m,ti,li,mode:"consol",pool,goal:1,label:MODS[m].tracks[ti].levels[li].name.replace(/^\d+\.\s*/,"")+" · nouvelles phrases"});
  else ses=newSes({m,ti,li,mode:"level",pool});view={name:"play"};next();}

function startFocus(m,ids,label){const pool=ids.map(id=>RULES[m][id]).filter(Boolean);if(!pool.length)return;ses=newSes({m,mode:"focus",pool,goal:3,label});view={name:"play"};next();}
const doneRule=r=>ses.mode==="level"?isM(ses.m,r.id):((ses.rev[r.id]||0)>=ses.goal&&isM(ses.m,r.id));
function remaining(){return ses.pool.filter(r=>!doneRule(r));}
function replayQueue(m,rules){const q=[];rules.forEach(r=>{const st=S[m].r[r.id];if(!st||!st.n)return;
  (st.bad||[]).forEach(k=>q.push(typeof k==="number"?{id:r.id,ii:k}:k==="wd"||k==="dw"?{id:r.id,dir:k}:{id:r.id}));
  if(st.m)q.push({id:r.id,fresh:true});});return shuffle(q);}
function startReplay(m,rules,label){const q=replayQueue(m,rules).slice(0,40);if(!q.length){toastMsg="Rien à rejouer ici pour l'instant : aucune faute en attente et aucune notion acquise.";render();return;}
  ses=newSes({m,mode:"replay",pool:[],queue:q,total:q.length,label});view={name:"play"};next();}
let toastMsg="";
function next(){
  if(ses.mode==="replay"){if(!ses.queue.length){view={name:"done"};ses.cur=null;render();window.scrollTo(0,0);return;}
    let k=ses.queue.findIndex(x=>x.id!==ses.last);if(k<0)k=0;const q=ses.queue.splice(k,1)[0];const rule=RULES[ses.m][q.id];
    ses.last=rule.id;ses.cur=build(rule,q);ses.cur.tag=q.fresh?"Notion acquise : nouvelle phrase pour vérifier":"Tu t'étais trompée sur cette question : on la rejoue";ses.cur.at=Date.now();render();window.scrollTo(0,0);return;}
  const c=remaining();
  if(!c.length){view={name:"done"};ses.cur=null;render();window.scrollTo(0,0);return;}
  let rule=null,tag="";
  const ag=ses.again.findIndex(g=>g.at<=ses.n&&g.id!==ses.last);
  if(ag>=0){rule=RULES[ses.m][ses.again[ag].id];ses.again.splice(ag,1);tag="Rappel : tu t'es trompée sur cette notion tout à l'heure";}
  if(!rule&&ses.mode==="level"&&ses.n%5===4){const d=memRules(ses.m).filter(r=>isDue(ses.m,r.id)&&!ses.pool.includes(r)&&r.id!==ses.last);if(d.length){rule=rand(d);tag="Ancrage mémoriel : notion à revoir";}}
  if(!rule){
    const cand=c.length>1?c.filter(r=>r.id!==ses.last):c;
    const ws=cand.map(r=>{const s=S[ses.m].r[r.id];return 1+(s&&s.e&&!s.m?2:0)+(!s||!s.n?1:0);});
    let x=Math.random()*ws.reduce((a,b)=>a+b,0);rule=cand[0];
    for(let i=0;i<cand.length;i++){x-=ws[i];if(x<=0){rule=cand[i];break;}}
  }
  ses.last=rule.id;ses.cur=build(rule);ses.cur.tag=tag;ses.cur.at=Date.now();render();window.scrollTo(0,0);
}
function pickItem(rule,f){f=f||{};if(f.ii!=null&&rule.items[f.ii])return {i:f.ii,item:rule.items[f.ii]};
  const st=S[ses.m].r[rule.id]||{},cnt=st.it||[],n=rule.items.length,bad=new Set(f.fresh?(st.bad||[]):[]);let min=Infinity;for(let i=0;i<n;i++)if(!bad.has(i))min=Math.min(min,cnt[i]||0);
  let cand=[];for(let i=0;i<n;i++)if(!bad.has(i)&&(cnt[i]||0)===min)cand.push(i);if(!cand.length)for(let i=0;i<n;i++)cand.push(i);if(cand.length>1&&st.li!=null){const f=cand.filter(i=>i!==st.li);if(f.length)cand=f;}const i=rand(cand);return {i,item:rule.items[i]};}
function build(rule,f){f=f||{};
  if(rule.type==="tap"){
    const pk=pickItem(rule,f),item=pk.item;const parts=parse(item);const e=hasErr(item);
    const showErr=e&&Math.random()<0.62;
    return {rule,kind:"tap",ii:pk.i,parts,canErr:e,showErr,toks:tokens(parts,showErr?"w":"r"),done:false};
  }
  if(rule.type==="voc"){
    const base=rule.g?GPOOL[rule.g]:VOCR.filter(v=>!v.g);
    const st=S[ses.m].r[rule.id]||{},n=need(rule,st);
    const dir=f.dir?f.dir:st.m?(Math.random()<.5?"wd":"dw"):(st.wd||0)>=n?"dw":(st.dw||0)>=n?"wd":(Math.random()<.5?"wd":"dw");
    if(dir==="dw"){
      const sc=v=>{const A=fold(rule.t),B=fold(v.t);let cp=0;while(cp<A.length&&cp<B.length&&A[cp]===B[cp])cp++;let cs=0;while(cs<A.length&&cs<B.length&&A[A.length-1-cs]===B[B.length-1-cs])cs++;
        return (v.e===rule.p||rule.e===v.p?100:0)+cp*3+(cs>=2?cs*2:0)-Math.abs(A.length-B.length)*.5+(A[0]===B[0]?1:0)+((/ /.test(rule.t))===(/ /.test(v.t))?3:0)+Math.random();};
      const cand=base.filter(v=>v.id!==rule.id&&v.e!==rule.e&&v.t!==rule.t).map(v=>[sc(v),v]).sort((x,y)=>y[0]-x[0]);
      const top=cand.slice(0,7).map(x=>x[1]),first=top[0]&&(top[0].e===rule.p||rule.e===top[0].p)?[top.shift()]:[];
      const dis=[...first,...shuffle(top)].slice(0,3);
      return {rule,kind:"voc",dir,opts:shuffle([rule.t,...dis.map(v=>v.t)]),ans:rule.t,dis,done:false};
    }
    const trap=rule.p&&rule.p!==rule.e?[rule.p]:[];
    const others=shuffle(base.filter(v=>v.id!==rule.id&&v.e!==rule.e&&v.e!==rule.p)).slice(0,3-trap.length).map(v=>v.e);
    return {rule,kind:"voc",dir,opts:shuffle([rule.e,...trap,...others]),ans:rule.e,done:false};
  }
  if(rule.type==="para"){const pk=pickItem(rule,f),P=pparse(pk.item);return {rule,kind:"para",ii:pk.i,item:pk.item,toks:P.toks,errs:P.errs,sel:[],done:false};}
  if(rule.type==="ref")return {rule,kind:"ref",opts:shuffle([rule.ans,...rule.dis]),ans:rule.ans,done:false};
  const pk=pickItem(rule,f),it=pk.item;
  return {rule,kind:"qcm",ii:pk.i,ex:it[2]||"",q:it[0],opts:shuffle(it[1]),ans:it[1][0],done:false};
}
const fold=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z ]/g,"");
const vocDone=(rule,st)=>{const n=need(rule,st);return (st.wd||0)>=n&&(st.dw||0)>=n;};
function record(ok){
  const c=ses.cur,m=ses.m,st=rs(m,c.rule.id),now=Date.now();
  st.n++;S[m].q++;if(c.ii!=null){st.it=st.it||[];st.it[c.ii]=(st.it[c.ii]||0)+1;st.li=c.ii;}
  if(c.dir){if(ok)st[c.dir]=(st[c.dir]||0)+1;else st[c.dir]=0;}
  {const key=c.ii!=null?c.ii:(c.dir||"x");st.bad=(st.bad||[]).filter(k=>k!==key);if(!ok)st.bad.push(key);}
  if(ses.mode==="replay"&&!ok)ses.queue.push({id:c.rule.id,ii:c.ii,dir:c.dir});
  if(ok){st.s++;S[m].c++;ses.ok++;
    if(!st.m){if(c.dir?vocDone(c.rule,st):st.s>=need(c.rule,st)){st.m=1;st.k=st.e?0:3;st.d=now+jit(IV[st.k]);c.justM=true;}}
    else if(st.d&&st.d<=now){st.k=Math.min((st.k||0)+1,IV.length-1);st.d=now+jit(IV[st.k]);}
  }else{st.s=0;st.e++;st.m=0;st.d=0;st.k=0;
    ses.again=ses.again.filter(g=>g.id!==c.rule.id);ses.again.push({id:c.rule.id,at:ses.n+3});}
  if(ses.mode==="review"&&!(c.rule.id in ses.rev)){const t=today();if(!S[m].rd||S[m].rd.d!==t)S[m].rd={d:t,n:0};S[m].rd.n++;}
  if(ses.mode!=="level")ses.rev[c.rule.id]=ok?(ses.rev[c.rule.id]||0)+1:0;
  S[m].sec+=Math.min((Date.now()-c.at)/1000,90);

      return `<button class="${cls}" ${c.done?"disabled":`data-act="pick" data-i="${i}"`}>${esc(cap(o))}</button>`;}).join("")}</div>`;
    if(c.done)body+=`<div class="example"><div class="book">${BOOK}</div><h4>${esc(cap(c.rule.t))}</h4><p>${esc(PV?c.rule.e:c.rule.x)}</p></div>
      <div class="others"><b>Les autres propositions</b>${c.dis.map(v=>`<p><span>${esc(cap(v.t))}</span> : ${esc(v.e)}</p>`).join("")}</div>`+nextRow(c);
  }else if(c.kind==="voc"){
    body=`<p class="word">${esc(cap(c.rule.t))}</p>
    <div class="grid ${c.opts.some(o=>o.length>45)?"list":""}">${c.opts.map((o,i)=>{let cls="tile";if(c.done){if(o===c.ans)cls+=" ok";else if(c.pick===i)cls+=" bad";}
      return `<button class="${cls}" ${c.done?"disabled":`data-act="pick" data-i="${i}"`}>${esc(cap(o))}</button>`;}).join("")}</div>`;
    if(c.done)body+=`<div class="example"><div class="book">${BOOK}</div><h4>${esc(cap(c.rule.t))}</h4><p>${esc(c.rule.x)}</p></div>`+nextRow(c);
  }else{
    body=`<p class="word" style="font-weight:500">${esc(c.q)}</p>
    <div class="grid ${c.opts.some(o=>o.length>28)?"list":""}">${c.opts.map((o,i)=>{let cls="tile";if(c.done){if(o===c.ans)cls+=" ok";else if(c.pick===i)cls+=" bad";}
      return `<button class="${cls}" ${c.done?"disabled":`data-act="pick" data-i="${i}"`}>${esc(o)}</button>`;}).join("")}</div>`;
    if(c.done)body+=`${c.ex?`<p class="correct"><b>Corrigé :</b> ${esc(c.ex)}</p>`:""}<div class="rulehead"><h3>${esc(c.rule.t)}</h3></div><p class="ruletxt">${esc(c.rule.e)}</p>`+nextRow(c);
  }
  return playBar()+banner(c)+`<main class="wrap ex ${c.done?"answered":""}">${body}</main>`;
}
function donePage(){
  const m=ses.m,M=MODS[m];
  if(ses.mode!=="level")return plainBar()+`<div class="banner ok"><div class="wrap"><strong>Bravo !</strong><span>${ses.mode==="replay"?"Fautes rejouées et notions vérifiées.":ses.mode==="consol"?"Compétence confirmée sur de nouvelles phrases.":ses.mode==="focus"?"Notion acquise.":"Révision terminée."}</span></div></div><main class="wrap page"><p>${ses.n} questions, ${pct(ses.ok,ses.n)} % de bonnes réponses. ${ses.mode==="replay"?"Chaque question ratée a été rejouée jusqu'à la bonne réponse, et chaque notion acquise a été vérifiée sur une phrase nouvelle.":"Chaque notion revue est de nouveau acquise ; elle reviendra en rappel dans quelques jours pour l'ancrer."}</p>
   <div class="row"><button class="btn pri" data-act="mod" data-m="${m}">Retour au module</button><button class="btn" data-act="home">Accueil</button></div></main>`;
  const T=M.tracks[ses.ti],L=T.levels,nextLi=ses.li+1<L.length?ses.li+1:null;
  return plainBar()+`<div class="banner ok"><div class="wrap"><strong>Bravo !</strong><span>${esc(L[ses.li].name)} : 100 %</span></div></div><main class="wrap page">
   <p>${M.tracks.length>1?esc(T.name)+" · ":""}${L[ses.li].rules.length} notions acquises.${ses.n?` Sur cette séance : ${ses.n} questions, ${pct(ses.ok,ses.n)} % justes.`:""}</p>
   <div class="row">${nextLi!=null?`<button class="btn pri" data-act="level" data-m="${m}" data-ti="${ses.ti}" data-li="${nextLi}">${esc(L[nextLi].name)}</button>`:""}<button class="btn" data-act="mod" data-m="${m}">Retour au module</button></div></main>`;
}
let saveMsg={},confirmKey=null;
/* Code de sauvegarde v2 : version allégée + compressée (G2.), lecture des anciens codes acceptée */
function slimS(){const o={};ORDER.forEach(m=>{const r={};Object.entries(S[m].r).forEach(([id,x])=>{if(!x)return;const y={};["s","e","n","m","d","k","wd","dw","bad"].forEach(f=>{if(x[f]!=null&&x[f]!==0&&!(Array.isArray(x[f])&&!x[f].length))y[f]=x[f];});r[id]=y;});
  o[m]={r,sec:Math.round(S[m].sec||0),q:S[m].q,c:S[m].c,u:S[m].u,last:S[m].last,ul:S[m].ul,adv:S[m].adv};});return o;}
const b64u=bytes=>{let s="";for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");};
const ub64=str=>{str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";const b=atob(str),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
async function makeCode(){const json=JSON.stringify({app:"graphie",v:2,at:Date.now(),S:slimS()}),raw=new TextEncoder().encode(json);
  if(typeof CompressionStream==="function"){try{const buf=await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();return "G2."+b64u(new Uint8Array(buf));}catch(e){}}
  return "G1."+b64u(raw);}
async function readCode(code){code=(code||"").replace(/\s+/g,"");let json;
  if(code.startsWith("G2.")){const buf=await new Response(new Blob([ub64(code.slice(3))]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();json=new TextDecoder().decode(buf);}
  else if(code.startsWith("G1."))json=new TextDecoder().decode(ub64(code.slice(3)));
  else json=decodeURIComponent(escape(atob(code)));
  const o=JSON.parse(json);if(!o||o.app!=="graphie"||!o.S)throw new Error("bad");return o;}
let codeCache="";
function fillCode(){makeCode().then(c=>{codeCache=c;const ta=document.getElementById("exp");if(ta){ta.value=c;const n=document.getElementById("explen");if(n)n.textContent=c.length.toLocaleString("fr-FR")+" caractères";}}).catch(()=>{});}
function savesPage(){
  const fmtD=u=>u?new Date(u).toLocaleDateString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"jamais";
  return plainBar()+`<main class="wrap page"><div class="head"><button class="back" data-act="home" aria-label="Retour">←</button><div><h1>Sauvegardes</h1><div class="sub">${SYNC==="cloud"?"Progression enregistrée sur ton compte et sur cet appareil.":"Progression enregistrée sur cet appareil. Garde un code de secours ci-dessous."}</div></div></div>
  ${ORDER.map(m=>{const st=modStat(m);return `<div class="box"><h3>${MODS[m].name}</h3><p>${st.mas}/${st.tot} acquises · ${S[m].q} réponses · ${fmtTime(S[m].sec)} · dernière activité : ${fmtD(S[m].u)}</p>
    ${confirmKey==="reset-"+m?`<div class="confirm">Effacer toute la progression de ce module ? <button class="btn danger" data-act="doreset" data-m="${m}">Oui, effacer</button><button class="btn" data-act="cancel">Annuler</button></div>`:`<div><button class="linkbtn" data-act="askreset" data-m="${m}">Réinitialiser ce module</button></div>`}</div>`;}).join("")}
  ${SYNC==="cloud"?`<div class="box"><h3>Synchronisation automatique</h3><p>Tu es connectée : ta progression est fusionnée automatiquement entre tous les appareils où tu ouvres l'appli via Claude (téléphone, ordinateur). Les codes ci-dessous ne servent que de secours, ou pour la version GitHub.</p></div>`:""}
  <div class="box"><h3>Code de sauvegarde</h3><p>Copie ce code et colle-le sur ton autre appareil, dans « Restaurer depuis un code ». Il contient tous les modules.</p>
   <textarea id="exp" readonly>${esc(codeCache||"Préparation du code…")}</textarea>
   <div class="row"><button class="btn" data-act="copy">Copier le code</button>${navigator.share?`<button class="btn" data-act="sharecode">Envoyer…</button>`:""}<span class="msg ok">${saveMsg.copy||""}</span><span class="msg" id="explen"></span></div></div>
  <div class="box"><h3>Restaurer depuis un code</h3><textarea id="imp" placeholder="Colle ici un code de sauvegarde"></textarea>
   ${confirmKey==="import"?`<div class="confirm">Que faire avec ce code ?<br><button class="btn pri" data-act="doimport" data-how="merge">Fusionner avec ma progression</button><button class="btn danger" data-act="doimport" data-how="replace">Remplacer tout</button><button class="btn" data-act="cancel">Annuler</button><br><small>Fusionner garde le meilleur des deux appareils : pour chaque notion, la version la plus travaillée.</small></div>`:`<div class="row"><button class="btn" data-act="askimport">Restaurer</button><span class="msg ${saveMsg.impOk?"ok":"bad"}">${saveMsg.imp||""}</span></div>`}</div></main>`;
}

/* ===================== INTERACTIONS ===================== */
let pendingImport="";
function answered(){render();window.scrollTo(0,0);}
app.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,m=el.dataset.m;
  if(a==="home")go({name:"home"});
  else if(a==="mod")go({name:"mod",m,ti:el.dataset.ti!=null?+el.dataset.ti:(ses&&ses.m===m&&ses.ti!=null?ses.ti:null)});
  else if(a==="tab"){view.ti=+el.dataset.ti;render();}
  else if(a==="toggleul"){S[m].ul=!S[m].ul;persist(m);render();}
  else if(a==="rules")go({name:"rules",m});
  else if(a==="rf"){view.f=el.dataset.f;render();}
  else if(a==="saves"){saveMsg={};confirmKey=null;go({name:"saves"});}
  else if(a==="resume"){const ti=(S[m].last&&S[m].last.ti)||0;startLevel(m,ti,curLevel(m,ti));}
  else if(a==="level")startLevel(m,+el.dataset.ti,+el.dataset.li);
  else if(a==="review")startReview(m);
  else if(a==="dq"){setDQ(+el.dataset.v);render();}
  else if(a==="dqmore"){const t=today();if(!S.exp.rd||S.exp.rd.d!==t)S.exp.rd={d:t,n:0,b:0};S.exp.rd.b=(S.exp.rd.b||0)+10;persist("exp");render();}
  else if(a==="replay")startReplay(m,Object.values(RULES[m]),"Rejouer : fautes + nouvelles phrases");
  else if(a==="replaygrp"){const l=MODS[m].tracks[+el.dataset.ti].levels[+el.dataset.li];startReplay(m,l.rules,l.name.replace(/^\d+\.\s*/,"")+" · rejouer");}
  else if(a==="focus")startFocus(m,[el.dataset.id],"Révision ciblée");
  else if(a==="focusgrp"){const l=MODS[m].tracks[+el.dataset.ti].levels[+el.dataset.li];startFocus(m,l.rules.filter(r=>S[m].r[r.id]&&S[m].r[r.id].e).map(r=>r.id),l.name+" · erreurs");}
  else if(a==="quit")go({name:"mod",m:ses.m,ti:ses.ti!=null?ses.ti:null});
  else if(a==="tap"){const c=ses.cur;if(c.done||c.stage==="write")return;const i=+el.dataset.i;c.tap=i;
    if(S[ses.m].adv&&c.showErr&&c.toks[i].err){c.stage="write";render();const f=document.getElementById("fixin");if(f)f.focus();return;}
    record(c.showErr&&c.toks[i].err);answered();}
  else if(a==="adv"){S[ses.m].adv=el.checked;persist(ses.m);}
  else if(a==="write"||a==="giveup"){const c=ses.cur;if(c.done||c.stage!=="write")return;const pt=c.parts.find(p=>p.err);
    const v=a==="giveup"?"":(document.getElementById("fixin")||{}).value||"";c.typed=v;c.stage=null;record(a==="write"&&fixOk(v,pt));answered();}
  else if(a==="ptap"){const c=ses.cur;if(c.done||c.stage==="write")return;const i=+el.dataset.i,j=c.sel.indexOf(i);if(j<0)c.sel.push(i);else c.sel.splice(j,1);const y=window.scrollY;render();window.scrollTo(0,y);}
  else if(a==="pfinish"){const c=ses.cur;if(c.done||c.stage==="write")return;c.found=new Set(c.sel.map(i=>c.toks[i].k).filter(k=>k>=0));c.fp=c.sel.filter(i=>c.toks[i].k<0).length;
    if(S[ses.m].adv&&c.sel.length){const seen=new Set();c.fixes=c.sel.slice().sort((x,y)=>x-y).filter(i=>{const k=c.toks[i].k;if(k<0)return true;if(seen.has(k))return false;seen.add(k);return true;}).map(i=>{const k=c.toks[i].k;return k>=0?{k,w:c.errs[k].w}:{k:-1,w:c.toks[i].t.replace(/[.,;:!?»]+$/,"")};});c.stage="write";render();const f=document.getElementById("pfix0");if(f)f.focus();return;}
    record(c.found.size===c.errs.length&&c.fp===0);answered();}
  else if(a==="pwrite"){const c=ses.cur;if(c.done||c.stage!=="write")return;c.typed={};let allFix=true;
    c.fixes.forEach((x,j)=>{const v=(document.getElementById("pfix"+j)||{}).value||"";if(x.k>=0){c.typed[x.k]=v;const good=fixOk(v,{w:c.errs[x.k].w,r:c.errs[x.k].r});c.fixOk=c.fixOk||{};c.fixOk[x.k]=good;if(!good)allFix=false;}});
    c.stage=null;record(c.found.size===c.errs.length&&c.fp===0&&allFix);answered();}
  else if(a==="nofault"){const c=ses.cur;if(c.done)return;c.tap=null;record(!c.showErr);answered();}
  else if(a==="pick"){const c=ses.cur;if(c.done)return;const i=+el.dataset.i;c.pick=i;record(c.opts[i]===c.ans);answered();}
  else if(a==="next")cont();
  else if(a==="askreset"){confirmKey="reset-"+m;render();}
  else if(a==="cancel"){confirmKey=null;render();}
  else if(a==="doreset"){S[m]=blank();persist(m);confirmKey=null;render();}
  else if(a==="copy"){const ta=document.getElementById("exp");const sel=()=>{ta.removeAttribute("readonly");ta.focus();ta.setSelectionRange(0,ta.value.length);let ok=false;try{ok=document.execCommand("copy");}catch(e){}ta.setAttribute("readonly","");saveMsg.copy=ok?"Copié":"Code sélectionné : copie-le";const v=ta.value;render();const t2=document.getElementById("exp");if(t2)t2.value=v;};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(()=>{saveMsg.copy="Copié";render();}).catch(sel);}else sel();}
  else if(a==="sharecode"){navigator.share({title:"Code de sauvegarde Graphie",text:codeCache}).catch(()=>{});}
  else if(a==="askimport"){pendingImport=document.getElementById("imp").value;
    readCode(pendingImport).then(()=>{confirmKey="import";saveMsg={};render();document.getElementById("imp").value=pendingImport;})
    .catch(()=>{saveMsg={imp:"Ce code n'est pas reconnu. Vérifie qu'il est complet (il doit commencer par G2. ou G1.).",impOk:false};render();document.getElementById("imp").value=pendingImport;});}
  else if(a==="doimport"){const how=el.dataset.how;readCode(pendingImport).then(o=>{ORDER.forEach(k=>{const inc=o.S[k]?norm(o.S[k]):null;if(how==="replace")S[k]=inc||blank();else if(inc)S[k]=mergeMod(S[k],inc);persist(k);});confirmKey=null;codeCache="";saveMsg={imp:how==="replace"?"Progression remplacée.":"Progressions fusionnées.",impOk:true};render();})
    .catch(()=>{confirmKey=null;saveMsg={imp:"La restauration a échoué.",impOk:false};render();});}
});
const nz=s=>s.trim().replace(/\s+/g," ").replace(/[’ʼ]/g,"'");
const lf=s=>s.charAt(0).toLowerCase()+s.slice(1);
function fixOk(v,pt){const x=nz(v),r=nz(pt.r),w=nz(pt.w);if(!x)return false;if(x===r)return true;return lf(w)!==lf(r)&&lf(x)===lf(r);}
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("pfixin")){e.preventDefault();e.stopPropagation();const all=[...document.querySelectorAll(".pfixin")],j=all.indexOf(e.target);if(j<all.length-1)all[j+1].focus();else{const b=document.querySelector('[data-act="pwrite"]');if(b)b.click();}return;}if(e.key==="Enter"&&e.target.id==="fixin"){e.preventDefault();e.stopPropagation();const b=document.querySelector('[data-act="write"]');if(b)b.click();return;}});
app.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("w")){e.preventDefault();e.target.click();}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&view.name==="play"&&ses&&ses.cur&&ses.cur.done&&!(e.target.closest&&e.target.closest("button"))){e.preventDefault();cont();}});

loadLocal();render();initCloud();
</script>
